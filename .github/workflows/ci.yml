name: Site CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify root site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.6.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test unit contracts
        run: pnpm test:unit

      - name: Test content contracts
        run: pnpm test:content

      - name: Build root site
        run: pnpm build:root

      - name: Check root build budget
        run: pnpm check:budget

      - name: Test root routes
        run: pnpm test:browser
        env:
          PLAYWRIGHT_BASE_PATH: /

      - name: Test root performance
        run: pnpm test:performance
        env:
          PLAYWRIGHT_BASE_PATH: /

      - name: Upload root QA failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-playwright-performance-evidence
          path: |
            .artifacts/playwright/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  pages-build:
    name: Build and verify Pages artifact
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.6.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Pages site
        run: pnpm build
        env:
          VITEPRESS_BASE: /Vdoc-site/

      - name: Check Pages build budget
        run: pnpm check:budget

      - name: Test Pages routes
        run: pnpm test:browser
        env:
          PLAYWRIGHT_BASE_PATH: /Vdoc-site/

      - name: Test Pages performance
        run: pnpm test:performance
        env:
          PLAYWRIGHT_BASE_PATH: /Vdoc-site/

      - name: Upload Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: github-pages
          path: docs/.vitepress/dist
          retention-days: 14

      - name: Record Pages artifact evidence
        shell: bash
        run: |
          artifact_sha256="$(sha256sum "$RUNNER_TEMP/artifact.tar" | cut -d ' ' -f 1)"
          {
            echo "### GitHub Pages artifact"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Workflow run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Artifact name: \`github-pages\`"
            echo "- Artifact ID: \`${{ steps.pages-artifact.outputs.artifact_id }}\`"
            echo "- Artifact SHA-256: \`${artifact_sha256}\`"
            echo "- Source directory: \`docs/.vitepress/dist/\`"
            echo "- QA steps: Pages build budget, routes, and performance"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages QA failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-build-playwright-performance-evidence
          path: |
            .artifacts/playwright/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy GitHub Pages
    needs: pages-build
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy exact Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages
