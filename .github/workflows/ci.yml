name: Site CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify root site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.6.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test unit contracts
        run: pnpm test:unit

      - name: Test release lock resolution
        run: bash scripts/test-release-lock.sh

      - name: Generate Compose download from sources
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: pnpm workspace:package

      - name: Generate non-deployable download candidate
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        run: pnpm workspace:package --candidate

      - name: Test content contracts
        run: pnpm test:content

      - name: Build root site
        run: pnpm build:root

      - name: Check root build budget
        run: pnpm check:budget

      - name: Test root routes
        run: pnpm test:browser
        env:
          PLAYWRIGHT_BASE_PATH: /

      - name: Test root performance
        run: pnpm test:performance
        env:
          PLAYWRIGHT_BASE_PATH: /

      - name: Package verified site and downloads
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: pnpm site:package

      - name: Upload distribution artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-distribution
          path: |
            .artifacts/release/*.tar.gz
            .artifacts/release/*.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload root QA failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-playwright-performance-evidence
          path: |
            .artifacts/playwright/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: site-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download verified distribution artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name site-distribution --dir release

      - name: Verify checksums
        working-directory: release
        run: sha256sum --check *.sha256

      - name: Create GitHub Release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo 'Release tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease' >&2
            exit 1
          }
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release/*.tar.gz release/*.sha256 \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${options[@]}"
