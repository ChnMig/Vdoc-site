name: Site CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify root site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.6.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test unit contracts
        run: pnpm test:unit

      - name: Test content contracts
        run: pnpm test:content

      - name: Build root site
        run: pnpm build:root

      - name: Check root build budget
        run: pnpm check:budget

      - name: Test root routes
        run: pnpm test:browser
        env:
          PLAYWRIGHT_BASE_PATH: /

      - name: Test root performance
        run: pnpm test:performance
        env:
          PLAYWRIGHT_BASE_PATH: /

      - name: Upload root QA failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-playwright-performance-evidence
          path: |
            .artifacts/playwright/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
