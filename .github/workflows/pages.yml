name: Publish release to GitHub Pages

on:
  workflow_call:
    inputs:
      release_tag:
        description: Published stable Site release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable Site tag to deploy (for example v0.1.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify Pages release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    steps:
      - name: Require an existing stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Pages requires a stable vMAJOR.MINOR.PATCH release tag' >&2
            exit 1
          }
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease |
            jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false and .isPrerelease == false'

      - name: Checkout deployment tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Checkout the released site
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.release_tag }}
          path: .artifacts/pages-site
          persist-credentials: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Require the GitHub default domain
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          [[ "$PAGES_ORIGIN" == 'https://chnmig.github.io' && "$PAGES_BASE_PATH" == '/Vdoc-site' ]] || {
            echo 'This build targets https://chnmig.github.io/Vdoc-site/; check the Pages domain settings' >&2
            exit 1
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.6.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: .artifacts/pages-site/pnpm-lock.yaml

      - name: Download the published Compose files
        working-directory: .artifacts/pages-site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          artifact="$(jq -er '.artifact_name | select(test("^[A-Za-z0-9._-]+$"))' workspace/workspace-distribution.json)"
          gh release download "$RELEASE_TAG" --dir docs/public/downloads \
            --pattern "$artifact.tar.gz" --pattern "$artifact.tar.gz.sha256"
          if [[ -f workspace/deploy/docker-compose.yml ]]; then
            gh release download "$RELEASE_TAG" --dir docs/public/downloads \
              --pattern docker-compose.yml --pattern docker-compose.yml.sha256
          fi

      - name: Verify the published download and source identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-pages-download.mjs .artifacts/pages-site "$RELEASE_TAG"

      - name: Adapt legacy website links to the Pages domain
        run: node scripts/prepare-pages-links.mjs .artifacts/pages-site

      - name: Install dependencies and Chromium
        working-directory: .artifacts/pages-site
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Check the released sources
        working-directory: .artifacts/pages-site
        run: |
          pnpm format:check
          pnpm typecheck
          pnpm lint
          pnpm test:unit
          pnpm test:content

      - name: Build and verify the Pages base
        working-directory: .artifacts/pages-site
        env:
          PLAYWRIGHT_BASE_PATH: /Vdoc-site/
        run: |
          pnpm build:pages
          pnpm check:budget
          pnpm test:browser
          pnpm test:performance

      - name: Upload the verified Pages output
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .artifacts/pages-site/docs/.vitepress/dist
          include-hidden-files: true
          retention-days: 14

      - name: Upload Pages failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pages-playwright-evidence
          path: |
            .artifacts/pages-site/.artifacts/playwright/
            .artifacts/pages-site/playwright-report/
            .artifacts/pages-site/test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy the verified Pages output
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
