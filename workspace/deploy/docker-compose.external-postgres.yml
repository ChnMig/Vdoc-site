# 接入现有 PostgreSQL：只启动 RustFS、后端和前端，不创建或管理数据库服务/数据卷。
# 单独保存为 docker-compose.yml 使用，不要与内置数据库版用 -f 叠加。
# 先由数据库管理员创建 Vdoc 专用数据库和可执行表结构迁移的账号。
# 替换全部 CHANGE_ME 值；此文件包含密码和密钥，请限制读取权限并保留备份。
# 值中的字面量美元符号写为 $$；&name 定义 YAML 锚点，*name 引用同一值。
# 更新时保留账号、密钥和项目名；运行中的容器不会自动更新，需执行：
# docker compose pull && docker compose up -d --wait
# 项目名决定默认网络及数据卷前缀，部署后不要随意修改。
name: vdoc

# 后端镜像：latest 跟随最新已发布稳定版，也可改成固定版本 tag 或 digest。
x-backend-image: &backend-image ghcr.io/chnmig/vdoc:latest
# 前端镜像：固定版本时，应与后端选择相同的发布版本。
x-admin-image: &admin-image ghcr.io/chnmig/vdoc-admin:latest

# 后端与一次性配置检查共用的环境变量，无需额外 .env 文件。
x-backend-environment: &backend-environment
  # 运行模式：release 为生产模式。
  model: release
  # 后端容器内的 HTTP 端口，需与 backend.ports 的容器端口一致。
  VDOC_SERVER_PORT: "8080"
  # 容器由 Docker 管理，留空以禁用宿主机模式的 PID 文件。
  VDOC_SERVER_PID_FILE: ""
  # 允许任意来源的浏览器请求；登录、权限与 Token 校验仍然生效。
  VDOC_SERVER_CORS_ALLOWED_ORIGINS: "*"
  # 启用 PostgreSQL 持久化。
  VDOC_DATABASE_ENABLED: "true"
  # 现有数据库的可达域名/IP；不带协议或端口，不能填容器自己的 127.0.0.1。
  # 宿主机上的数据库可填 host.docker.internal，下方 extra_hosts 提供 Linux 映射。
  VDOC_DATABASE_HOST: "CHANGE_ME_DATABASE_HOST"
  # 现有数据库对应用容器开放的端口，按实际服务配置修改。
  VDOC_DATABASE_PORT: "5432"
  # 已创建的 Vdoc 专用数据库；后端会在其中建表/迁移，不会创建数据库本身。
  VDOC_DATABASE_NAME: vdoc
  # 连接账号应拥有此数据库/应用表，并具备 public schema 的 USAGE、CREATE 权限。
  VDOC_DATABASE_USER: vdoc
  # 现有账号的真实密码；无需 URL 编码，字面量 $ 仍需写成 $$。
  VDOC_DATABASE_PASSWORD: "CHANGE_ME_DATABASE_PASSWORD"
  # require 强制 TLS 加密，但不校验服务端身份；按数据库服务的 TLS 要求配置。
  # 仅对明确未启用 TLS 的可信本机/私网数据库改成 disable。
  VDOC_DATABASE_SSL_MODE: require
  # 连接池上限与空闲连接数，多个应用实例需共同考虑数据库连接额度。
  VDOC_DATABASE_MAX_OPEN_CONNS: "20"
  VDOC_DATABASE_MAX_IDLE_CONNS: "5"
  # 启用存放文档内容的 S3 兼容对象存储。
  VDOC_STORAGE_ENABLED: "true"
  # RustFS 内部地址：仅填写主机和端口，不带 http:// 或路径。
  VDOC_STORAGE_ENDPOINT: rustfs:9000
  # 存储桶名；后端首次启动会创建尚不存在的桶。
  VDOC_STORAGE_BUCKET: vdoc
  # RustFS 账号至少 3 字符、密码至少 8 字符；通过锚点与存储服务保持一致。
  VDOC_STORAGE_ACCESS_KEY: &storage-user "CHANGE_ME_STORAGE_ACCESS_KEY"
  VDOC_STORAGE_SECRET_KEY: &storage-password "CHANGE_ME_STORAGE_SECRET_KEY"
  # 内部 RustFS 使用 HTTP；若改用外部 HTTPS S3 服务，改为 true。
  VDOC_STORAGE_USE_SSL: "false"
  # RustFS 使用路径式桶地址，不要求为每个桶配置子域名。
  VDOC_STORAGE_PATH_STYLE: "true"
  # 登录 JWT 签名密钥：至少 32 字符的独立随机值，升级时保留。
  VDOC_JWT_KEY: "CHANGE_ME_JWT_KEY"
  # MCP Token、AI Provider 密钥、分享凭证的加密密钥，至少 32 字符，勿与 JWT 共用。
  VDOC_MCP_TOKEN_CIPHER_KEY: "CHANGE_ME_MCP_ENCRYPTION_KEY"
  # 当前加密密钥的标识；仅按密钥轮换流程变更。
  VDOC_MCP_TOKEN_CIPHER_KID: local-aes-gcm-v1
  # 历史 KID 到密钥的 JSON 映射；首次部署留空对象，轮换时参考维护文档。
  VDOC_MCP_TOKEN_CIPHER_KEYRING: "{}"
  # 关闭公开注册，由管理员管理用户账号。
  VDOC_AUTH_ALLOW_REGISTRATION: "false"
  # 仅当用户表为空时创建首个管理员；重启不会覆盖已有账号和密码。
  VDOC_INITIAL_ADMIN_EMAIL: "admin@example.com"
  VDOC_INITIAL_ADMIN_NAME: "Vdoc Admin"
  # 首次管理员密码为 12–72 字节。
  VDOC_INITIAL_ADMIN_PASSWORD: "CHANGE_ME_INITIAL_ADMIN_PASSWORD"

# 常驻服务与一次性配置检查；容器之间默认通过同一个 Compose 网络通信。
services:
  # 只校验配置，不连接数据库、不执行迁移；成功后退出码为 0。
  config-check:
    # 复用与后端相同的镜像、配置和检查入口。
    image: *backend-image
    command: ["--check-config"]
    environment: *backend-environment
    # 一次性任务不自动重启；禁用镜像自带的常驻 HTTP 健康检查。
    restart: "no"
    healthcheck:
      disable: true

  # 文档对象存储；9000 为 S3 API，9001 为控制台，仅在容器网络内开放。
  rustfs:
    # 按部署约定固定在 RustFS 1.0.0。
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    # 避免在密码、密钥等配置仍无效时初始化存储。
    depends_on:
      config-check:
        condition: service_completed_successfully
    environment:
      # 对象数据目录，必须与下方 rustfs-data 的挂载目标一致。
      RUSTFS_VOLUMES: /data
      # 容器内 S3 API 和控制台监听地址。
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      # 启用内部管理控制台；未配置 ports，因此不会向宿主机发布。
      RUSTFS_CONSOLE_ENABLE: "true"
      # 与后端使用同一组存储凭据。
      RUSTFS_ACCESS_KEY: *storage-user
      RUSTFS_SECRET_KEY: *storage-password
    volumes:
      # 对象数据和运行日志分别保存在持久卷中。
      - rustfs-data:/data
      - rustfs-logs:/app/logs
    healthcheck:
      # 用 S3 API 的健康接口确认存储服务就绪。
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/health"]
      # 检查间隔、单次超时和连续失败次数。
      interval: 10s
      timeout: 5s
      retries: 12
      # 启动宽限期内的失败不计入 retries。
      start_period: 40s

  # 后端 API：启动时应用数据库迁移、准备存储桶并按需创建初始管理员。
  backend:
    image: *backend-image
    restart: unless-stopped
    # Compose 仅等待本项目的存储；外部 PostgreSQL 需事先可达且账号、库已准备好。
    depends_on:
      rustfs:
        condition: service_healthy
    # 引用顶部配置；HTTP 健康检查继承后端镜像的 HEALTHCHECK。
    environment: *backend-environment
    # 将宿主机别名映射到 Docker 网关，兼容 Linux Docker；不影响远程数据库连接。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 宿主机绑定地址:宿主机端口:容器端口；宿主机 Caddy 将后端域名反代到此端口。
      - "127.0.0.1:8080:8080"

  # 前端工作台，与后端使用独立端口和域名。
  admin:
    image: *admin-image
    restart: unless-stopped
    # 后端健康后启动前端。
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # 浏览器访问的后端 origin；使用 Caddy 时改成 https://api.example.com。
      # 不带 /api 或末尾斜杠，不可填 Docker 服务名；远程访问时不可保留 127.0.0.1。
      VDOC_ADMIN_API_BASE_URL: "http://127.0.0.1:8080"
    ports:
      # 宿主机 Caddy 将前端域名反代到 8081；容器内前端仍监听 8080。
      - "127.0.0.1:8081:8080"
    healthcheck:
      # 检查前端 HTTP 服务；每 10 秒检查，单次超时 5 秒，连续失败 6 次判为不健康。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

# 此文件仅管理 RustFS 卷；外部 PostgreSQL 的数据、备份和升级由原服务单独管理。
# 普通 down 保留这些卷，down -v 会删除对象数据和日志，升级时不要删除。
volumes:
  # 文档原始内容等对象数据。
  rustfs-data:
  # RustFS 运行日志。
  rustfs-logs:
